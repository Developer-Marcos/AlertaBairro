<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlertaBairro - Cidadaos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <div class="container barra">
            <a class="marca" href="index.html">AlertaBairro</a>
            <nav aria-label="Principal">
                <ul>
                    <li><a href="index.html">Painel</a></li>
                    <li><a href="ocorrencias.html">Ocorrencias</a></li>
                    <li><a href="abrigos.html">Abrigos</a></li>
                    <li><a href="cidadaos.html">Cidadaos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Cidadaos</h1>
        <p class="sub">Moradores cadastrados para registrar ocorrencias no bairro.</p>

        <p id="msg" class="msg" role="alert" hidden></p>

        <section class="cartao">
            <h2 id="titulo-form">Novo cidadao</h2>
            <form id="form" novalidate>
                <input type="hidden" name="id">
                <div class="campos">
                    <label>Nome <input type="text" name="nome" maxlength="100" required></label>
                    <label>E-mail <input type="email" name="email" maxlength="100" required></label>
                    <label>Telefone <input type="tel" name="telefone" maxlength="20" placeholder="11999999999" required></label>
                    <label>Endereco <input type="text" name="endereco" maxlength="150" required></label>
                    <label>Bairro <input type="text" name="bairro" maxlength="80" required></label>
                </div>
                <div class="acoes-form">
                    <button type="submit">Salvar</button>
                    <button type="button" class="leve" id="cancelar" hidden>Cancelar edicao</button>
                </div>
            </form>
        </section>

        <section class="cartao">
            <h2>Cidadaos cadastrados</h2>
            <table class="cartoes">
                <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Endereco</th><th>Bairro</th><th>Acoes</th></tr></thead>
                <tbody id="corpo"></tbody>
            </table>
        </section>
    </main>

    <footer><div class="container">AlertaBairro - Global Solution 2026/2 FIAP - CitizenTech</div></footer>

    <script src="js/app.js"></script>
    <script src="js/cidadaos.js"></script>
</body>
</html>
